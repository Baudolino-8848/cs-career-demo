<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>赛事总结窗口 · 静态设计稿</title>
<style>
/* ============================================================
   赛事总结二级窗口 —— 静态设计稿（自包含，假数据）
   配色沿用 style.css 的冷色令牌：浅灰白底 + 单一青色强调。
   ============================================================ */
:root{
  --bg:#F6F7F9;
  --surface:#FFFFFF;
  --surface-2:#F9FAFB;
  --surface-3:#F1F3F6;
  --line:#E7EAEF;
  --line-strong:#D6DBE2;

  --ink:#14171A;
  --ink-2:#5B6470;
  --ink-3:#9AA3AF;
  --ink-4:#C3C9D2;

  --accent:#06B6D4;
  --accent-d:#0E7490;
  --accent-soft:#ECFEFF;
  --accent-line:#A5F3FC;

  --pos:#059669;  --pos-soft:#ECFDF5;
  --warn:#D97706; --warn-soft:#FFFBEB;
  --neg:#DC2626;  --neg-soft:#FEF2F2;
  --violet:#7C3AED; --violet-soft:#F5F3FF;

  --r-xs:6px; --r-sm:9px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(16,24,40,.04);
  --sh-2:0 2px 8px rgba(16,24,40,.06);
  --sh-3:0 8px 24px rgba(16,24,40,.08);
  --sh-4:0 24px 64px rgba(16,24,40,.18);

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:28px 20px 40px;
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mock-note{
  max-width:1080px;margin:0 auto 16px;color:var(--ink-3);font-size:12px;
}
.mock-note b{color:var(--ink-2)}

/* ---------- 模态外壳（设计稿里内联展示，非浮层） ---------- */
.modal{max-width:1080px;margin:0 auto}
.modal-panel{
  background:var(--surface);border:1px solid var(--line-strong);
  border-radius:var(--r-xl);box-shadow:var(--sh-3);overflow:hidden;
  display:flex;flex-direction:column;max-height:calc(100vh - 96px);
}

/* ---------- 头部 ---------- */
.ev-head{
  position:relative;padding:18px 26px 20px;text-align:center;
  border-bottom:1px solid var(--line);flex:none;
}
.ev-head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.ev-head .ev-tier{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:3px 9px;border-radius:var(--r-pill);margin-bottom:8px;
  background:var(--accent-soft);color:var(--accent-d);
}
.ev-head .ev-date{
  display:inline-block;margin-top:12px;font-size:12px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 16px;
  background:var(--surface-2);
}

/* ---------- 主体 ---------- */
.ev-body{flex:1;min-height:0;overflow:auto;background:var(--surface)}
.ev-grid{display:grid;grid-template-columns:256px minmax(0,1fr);gap:16px;padding:18px}

/* 卡片 */
.ev-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:13px 14px;box-shadow:var(--sh-1);
}
.ev-card + .ev-card{margin-top:12px}
.ev-card h3{
  margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.02em;text-align:center;
}
.ev-card .sub{
  font-size:10.5px;color:var(--ink-3);text-align:center;margin:-6px 0 9px;
}

/* 赛事结果列表 */
.placing{display:flex;gap:8px;font-size:11.5px;padding:3px 0}
.placing .k{flex:none;color:var(--ink-3);width:34px;text-align:right}
.placing .v{color:var(--ink-2);line-height:1.5}
.placing .v b{color:var(--ink);font-weight:600}
.placing.gold .v b{color:var(--warn)}

/* MVP：第一行归属队伍，第二行选手名 + 位置 */
.mvp-main{text-align:center;margin:2px 0 10px}
.mvp-team{font-size:11.5px;font-weight:600;color:var(--accent-d);margin-bottom:4px}
.mvp-who{display:flex;align-items:baseline;justify-content:center;gap:7px}
.mvp-who b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.mvp-who span{font-size:11px;color:var(--ink-2)}
.mvp-rating{
  display:flex;align-items:baseline;justify-content:center;gap:6px;
  border-top:1px dashed var(--line);padding-top:9px;
}
.mvp-rating .lb{font-size:10px;color:var(--ink-3);letter-spacing:.08em}
.mvp-rating .vl{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--warn)}

/* 你的表现 */
.you-place{text-align:center;font-size:12px;color:var(--ink-2)}
.you-place + .you-place{margin-top:3px}
.you-place b{color:var(--warn);font-weight:700}
/* 赛季积分后面的本站变化：括号式小尾巴，正绿负红 */
.you-place .elo-tag{margin-left:6px;font-family:var(--mono);font-size:11.5px;font-weight:800}
.you-place .elo-tag.up{color:var(--pos)}
.you-place .elo-tag.dn{color:var(--neg)}
.you-place .elo-tag.flat{color:var(--ink-3)}
.you-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
.you-num{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 4px;text-align:center;
}
.you-num b{display:block;font-size:16px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.you-num span{font-size:9.5px;color:var(--ink-3);letter-spacing:.04em}
.you-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.you-meta div{
  text-align:center;font-size:10px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 2px;
}
.you-meta b{display:block;font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);margin-bottom:1px}

/* 榜单 */
.boards{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden}
.board h3{
  margin:0;padding:11px 14px;font-size:12px;font-weight:700;text-align:center;
  border-bottom:1px solid var(--line);background:var(--surface-2);
}
.board ol{list-style:none;margin:0;padding:6px 8px}
.board li{
  display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:9px;
  padding:6px 7px;border-radius:var(--r-sm);font-size:12px;
}
.board li:nth-child(odd){background:var(--surface-2)}
.board li.me{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.board li .no{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-3);text-align:right}
.board li .nm{min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden}
.board li .nm b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board li .nm span{
  font-size:10px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.board li .vl{font-family:var(--mono);font-weight:800;font-variant-numeric:tabular-nums}
.board li .no.top{color:var(--warn)}

/* ---------- 详细数据 ---------- */
/* 左栏 256px：比赛卡多了一行系列赛比分，留够队名不折行的宽度 */
.detail-grid{display:grid;grid-template-columns:256px minmax(0,1fr);gap:16px;padding:18px}
.team-card{text-align:center;margin-bottom:12px}
.team-name{font-size:15px;font-weight:800;color:var(--accent-d);letter-spacing:-.01em}
.team-place{font-size:11.5px;color:var(--ink-2);margin-top:5px}
.team-place b{color:var(--warn);font-weight:700}
/* 本站积分变化：整站累计，与逐场明细的求和一致 */
.team-elo{
  display:inline-flex;align-items:baseline;gap:5px;margin-top:7px;
  font-size:11px;color:var(--ink-3);background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:3px 11px;
}
.team-elo b{font-family:var(--mono);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.team-elo.up b{color:var(--pos)}
.team-elo.dn b{color:var(--neg)}
.team-elo.flat b{color:var(--ink-3)}
.match-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);padding:10px}
.match{
  border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;margin-bottom:8px;
  background:var(--surface);cursor:pointer;transition:border-color .15s ease,background .15s ease;
}
.match:last-child{margin-bottom:0}
.match .stage{font-size:10px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:3px}
.match .line{font-size:12px;line-height:1.45;color:var(--ink-2)}
.match .line b{color:var(--ink);font-weight:700}
/* 系列赛比分一行：左侧大号比分（我方在前）与胜/负，右侧本场积分变化 */
.match .foot{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.match .mscore{font-family:var(--mono);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.match .mscore.win{color:var(--pos)}
.match .mscore.lose{color:var(--neg)}
.match .foot .res{font-size:11px}
.match .res{font-weight:700}
.match .res.win{color:var(--pos)}
.match .res.lose{color:var(--neg)}
/* 本场积分变化：贴右，数字用等宽加粗，正绿负红；以强胜弱拿得少时数值本身就小 */
.match .elo{
  margin-left:auto;display:inline-flex;align-items:baseline;gap:4px;
  font-size:10px;color:var(--ink-3);letter-spacing:.02em;
}
.match .elo b{font-family:var(--mono);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.match .elo.up b{color:var(--pos)}
.match .elo.dn b{color:var(--neg)}
.match .elo.flat b{color:var(--ink-3)}
.match.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}

.detail-main{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden}
.map-tabs{display:flex;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.map-tab{
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  font:inherit;font-size:12px;font-weight:600;padding:6px 15px;border-radius:var(--r-sm);cursor:pointer;
}
.map-tab.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));border-color:transparent;color:#fff}
.map-tab.all{min-width:96px}

/* 单图比分板：切到某一图时顶在表格上方，是这一屏最显眼的元素 */
.map-score{padding:15px 18px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.map-score .ms-head{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:12px}
.map-score .ms-map{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.map-score .ms-line{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px}
.map-score .ms-side{font-size:13.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-score .ms-side.right{text-align:right}
.map-score .ms-nums{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.map-score .ms-nums b{font-size:37px;font-weight:800;line-height:1;color:var(--ink-4)}
.map-score .ms-nums b.hi{color:var(--pos)}
.map-score .ms-nums .colon{font-size:23px;font-weight:800;color:var(--ink-4)}
.map-score .ms-ot{margin-top:11px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--warn)}

.stat-wrap{overflow-x:auto;padding:13px}
.stat-table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.stat-table caption{
  text-align:left;font-size:12px;font-weight:800;color:var(--accent-d);
  padding:2px 4px 8px;
}
.stat-table caption .tag{
  display:inline-block;margin-left:7px;font-size:9.5px;font-weight:700;
  background:var(--surface-3);color:var(--ink-2);border-radius:var(--r-pill);padding:2px 8px;vertical-align:1px;
}
.stat-table th{
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);
  text-align:right;padding:6px 10px;background:var(--surface-2);border-bottom:1px solid var(--line-strong);
  white-space:nowrap;
}
.stat-table th:first-child{text-align:left}
.stat-table td{
  padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;
}
.stat-table td:first-child{
  text-align:left;font-family:var(--sans);font-weight:600;color:var(--ink);
}
/* 队名分隔行：把同一支队伍的选手归到一段 */
.stat-table tr.team-row td{
  text-align:left;font-family:var(--sans);font-size:11px;font-weight:700;
  letter-spacing:.04em;color:var(--ink-2);background:var(--surface-2);
  border-bottom:1px solid var(--line-strong);padding-top:8px;padding-bottom:8px;
}
.stat-table tr.me td{background:var(--accent-soft)}
.stat-table tr.me td:first-child::before{
  content:"你";display:inline-block;margin-right:7px;font-size:9.5px;font-weight:700;
  background:var(--accent);color:#fff;border-radius:var(--r-pill);padding:1px 6px;vertical-align:1px;
}
.stat-table .r-hi{color:var(--warn);font-weight:800}
.stat-table .r-mid{color:var(--pos);font-weight:700}
.stat-table .r-low{color:var(--ink-2)}
.stat-table .sw-up{color:var(--pos);font-weight:700}
.stat-table .sw-dn{color:var(--neg);font-weight:700}
.stat-table tbody + tbody tr:first-child td{border-top:1px solid var(--line-strong)}
.stat-table .role{
  font-family:var(--sans);font-weight:600;font-size:10.5px;color:var(--violet);
  background:var(--violet-soft);border-radius:var(--r-pill);padding:1px 7px;margin-left:6px;
}

/* ---------- 底部按钮 ---------- */
.ev-foot{
  flex:none;display:flex;justify-content:center;gap:12px;padding:15px 26px 19px;
  border-top:1px solid var(--line);background:var(--surface-2);
}
.ev-btn{
  font:inherit;font-size:13px;font-weight:600;min-width:122px;
  padding:10px 22px;border-radius:var(--r-md);cursor:pointer;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  transition:border-color .15s ease,background .15s ease,color .15s ease;
}
.ev-btn:hover{border-color:var(--accent-line);color:var(--accent-d)}
.ev-btn.on{
  background:linear-gradient(135deg,var(--accent),var(--accent-d));
  border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(6,182,212,.24);
}
.ev-btn.close{color:var(--ink-3)}
.ev-btn.close:hover{border-color:var(--line-strong);color:var(--ink)}

@media (max-width:820px){
  .ev-grid,.detail-grid{grid-template-columns:1fr}
  .boards{grid-template-columns:1fr}
  body{padding:14px 12px 24px}
}
</style>
</head>
<body>

<p class="mock-note">
  <b>静态设计稿</b> · 赛事总结二级窗口（假数据）。点底部「总览 / 详细数据」切换页面，「详细数据」里左侧比赛与右侧图标签都可点击。<br>
  本次新增：<b>积分变化</b>——每张比赛卡右下角显示这一场的赛季积分结算（<span class="up" style="color:var(--pos);font-weight:800">+43</span> / <span style="color:var(--neg);font-weight:800">-7</span>），左侧顶部与「总览 · 你的表现」显示本站累计。
</p>

<div class="modal">
  <div class="modal-panel">
    <header class="ev-head">
      <span class="ev-tier">S 级</span>
      <h1>IEM 科隆</h1>
      <div class="ev-date">比赛日期：2026 年 3 月 3 日 — 3 月 12 日</div>
    </header>
    <div class="ev-body" id="ev-body"></div>
    <footer class="ev-foot">
      <button class="ev-btn on" data-view="overview">总览</button>
      <button class="ev-btn" data-view="detail">详细数据</button>
      <button class="ev-btn close" data-view="close">关闭</button>
    </footer>
  </div>
</div>

<script>
"use strict";

/* ---------- 假数据（结构与 game.js 的 event_summary_payload 对齐） ----------
 * 积分字段（本次新增）：
 *   detail[].elo    这一场系列赛结算出来的赛季积分变化（整数，胜负各结算一次）
 *   you.season_before  本站开打前的赛季积分；站末积分 = season_before + 各场 elo 之和
 * 量级参考新机制：赢 = +55 × (1 − 期望)，输 = −45 × 期望，期望由双方实时排名差决定，
 * 因此单场区间约 −44 ～ +54，排名差越大（以强胜弱）赢得越少，爆冷拿得最多。
 * 本例的 Plus Sharks 是世界第 45 名的黑马，八强路上以弱胜强击败第 12 名的 BB，所以那一场拿了 +43。
 */
const MOCK = {
  event: {name: "IEM 科隆", tier: "S 级", from: "2026/3/3", to: "2026/3/12"},
  result: {champion: "Falcons", runner_up: "Spirit", semi: ["Furia", "Faze Clan"], quarter: ["Plus Sharks", "Mouz"]},

  you: {id: "Rookie", team: "Plus Sharks", placement: "八强", kills: 91, assists: 26, deaths: 62, maps: 8, rating: 1.18, kast: 67, adr: 78, season_before: 1148},
  rating_board: [
    {id: "Niko", team: "Falcons", rating: 1.25},
    {id: "donk", team: "Spirit", rating: 1.24},
    {id: "m0NESY", team: "Falcons", rating: 1.21},
    {id: "ZywOo", team: "Faze Clan", rating: 1.19},
    {id: "Rookie", team: "Plus Sharks", rating: 1.18, me: true},
    {id: "sh1ro", team: "Spirit", rating: 1.16},
    {id: "frozen", team: "Faze Clan", rating: 1.12},
    {id: "yuurih", team: "Furia", rating: 1.09},
    {id: "KSCERATO", team: "Furia", rating: 1.05},
    {id: "torzsi", team: "Mouz", rating: 1.04},
  ],
  kill_board: [
    {id: "donk", team: "Spirit", kills: 285},
    {id: "Niko", team: "Falcons", kills: 271},
    {id: "Rookie", team: "Plus Sharks", kills: 268, me: true},
    {id: "m0NESY", team: "Falcons", kills: 259},
    {id: "ZywOo", team: "Faze Clan", kills: 254},
    {id: "frozen", team: "Faze Clan", kills: 246},
    {id: "sh1ro", team: "Spirit", kills: 240},
    {id: "yuurih", team: "Furia", kills: 233},
    {id: "torzsi", team: "Mouz", kills: 228},
    {id: "KSCERATO", team: "Furia", kills: 221},
  ],
  detail: [
    {
      stage: "小组赛 第一场", opponent: "Falcons", won: false, score: [1, 2], elo: -7,
      maps: [
        {won: false, score: [9, 13], mine: [
          {id: "Rookie", role: "步枪手", k: 18, d: 19, a: 5, adr: 74, kast: 64, rating: 0.98, me: true},
          {id: "kaiR0N", role: "突破手", k: 15, d: 20, a: 4, adr: 68, kast: 61, rating: 0.88},
          {id: "s1mple", role: "狙击手", k: 20, d: 17, a: 3, adr: 82, kast: 70, rating: 1.09},
          {id: "Jame", role: "指挥", k: 12, d: 19, a: 6, adr: 61, kast: 65, rating: 0.82},
          {id: "electroNic", role: "补枪手", k: 16, d: 18, a: 5, adr: 71, kast: 66, rating: 0.94},

/* ---------- 渲染工具：文字一律走 textContent ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
// 单图 Swing（回合影响力）= (Rating - 1.00) * 6.5 个百分点。
const swing = r => (r - 1) * 6.5;
const fmtSwing = v => (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const ratingCls = r => (r >= 1.25 ? "r-hi" : r >= 1.00 ? "r-mid" : "r-low");

// 积分变化：正数带 +，零为中性；配色按涨 / 跌 / 平三档。
const eloCls = v => (v > 0 ? "up" : v < 0 ? "dn" : "flat");
const fmtElo = v => (v > 0 ? "+" : "") + v;
const eloTotal = list => list.reduce((sum, mt) => sum + mt.elo, 0);

const body = document.getElementById("ev-body");
let view = "overview";
let matchIdx = 0;
let mapIdx = "all";

/* ---------- 总览 ---------- */
function renderOverview() {
  const m = MOCK;
  const grid = el("div", "ev-grid");

  // 左栏
  const left = el("div");

  const c1 = el("div", "ev-card");
  c1.append(el("h3", "", "赛事结果"));
  const rows = [
    ["冠军", [m.result.champion], true],
    ["亚军", [m.result.runner_up], false],
    ["四强", m.result.semi, false],
    ["八强", m.result.quarter, false],
  ];
  for (const [k, list, gold] of rows) {
    const row = el("div", "placing" + (gold ? " gold" : ""));
    row.append(el("span", "k", k));
    const v = el("span", "v");
    list.forEach((name, i) => {
      if (i) v.append(document.createTextNode("、"));
      v.append(el("b", "", name));
    });
    row.append(v);
    c1.append(row);
  }
  left.append(c1);

  const c2 = el("div", "ev-card");
  c2.append(el("h3", "", "赛事 MVP"));
  const mvp = el("div", "mvp-main");
  mvp.append(el("div", "mvp-team", m.mvp.team));
  const mvpWho = el("div", "mvp-who");
  mvpWho.append(el("b", "", m.mvp.id), el("span", "", m.mvp.role));
  mvp.append(mvpWho);
  c2.append(mvp);
  const mr = el("div", "mvp-rating");
  mr.append(el("span", "lb", "RATING"), el("span", "vl", m.mvp.rating.toFixed(2)));
  c2.append(mr);
  left.append(c2);

  const c3 = el("div", "ev-card");
  c3.append(el("h3", "", "你的表现"));
  const place = el("div", "you-place");
  place.append(document.createTextNode("队伍表现  "), el("b", "", m.you.placement));
  const rate = el("div", "you-place");
  rate.append(document.createTextNode("Rating  "), el("b", "", m.you.rating.toFixed(2)));
  // 赛季积分：站末值 + 本站变化。本站变化等于逐场明细的求和，两处必须对得上。
  const total = eloTotal(m.detail);
  const season = el("div", "you-place");
  season.append(document.createTextNode("赛季积分  "), el("b", "", String(m.you.season_before + total)));
  season.append(el("span", "elo-tag " + eloCls(total), fmtElo(total)));
  c3.append(place, rate, season);
  const nums = el("div", "you-nums");
  for (const [label, val] of [["击杀", m.you.kills], ["助攻", m.you.assists], ["死亡", m.you.deaths]]) {
    const b = el("div", "you-num");
    b.append(el("b", "", String(val)), el("span", "", label));
    nums.append(b);
  }
  c3.append(nums);
  const meta = el("div", "you-meta");
  for (const [label, val] of [["地图", m.you.maps], ["KAST", m.you.kast + "%"], ["ADR", m.you.adr]]) {
    const b = el("div");
    b.append(el("b", "", String(val)), document.createTextNode(label));
    meta.append(b);
  }
  c3.append(meta);
  left.append(c3);

  // 右栏：两个榜单
  const boards = el("div", "boards");
  boards.append(buildBoard("Rating 榜单", m.rating_board, x => x.rating.toFixed(2)));
  boards.append(buildBoard("击杀榜", m.kill_board, x => String(x.kills)));

  grid.append(left, boards);
  body.replaceChildren(grid);
}

function buildBoard(title, list, valueOf) {
  const box = el("div", "board");
  box.append(el("h3", "", title));
  const ol = el("ol");
  list.forEach((item, i) => {
    const li = el("li", item.me ? "me" : "");
    li.append(el("span", "no" + (i < 3 ? " top" : ""), String(i + 1)));
    const nm = el("span", "nm");
    nm.append(el("b", "", item.id), el("span", "", item.team));
    li.append(nm, el("span", "vl", valueOf(item)));
    ol.append(li);
  });
  box.append(ol);
  return box;
}

/* ---------- 详细数据 ---------- */
function renderDetail() {
  const d = MOCK.detail;
  const grid = el("div", "detail-grid");

  // 左：队伍信息 + 比赛列表
  const left = el("div");
  const teamCard = el("div", "ev-card team-card");
  teamCard.append(el("div", "team-name", MOCK.you.team));
  const teamPlace = el("div", "team-place");
  teamPlace.append(document.createTextNode("队伍表现  "), el("b", "", MOCK.you.placement));
  teamCard.append(teamPlace);
  // 本站积分变化：整站累计，数值上等于下面每张比赛卡的积分之和。
  const total = eloTotal(d);
  const teamElo = el("div", "team-elo " + eloCls(total));
  teamElo.append(document.createTextNode("本站积分"), el("b", "", fmtElo(total)));
  teamCard.append(teamElo);
  left.append(teamCard);

  const list = el("div", "match-list");
  d.forEach((mt, i) => {
    const box = el("div", "match" + (i === matchIdx ? " on" : ""));
    box.append(el("div", "stage", mt.stage));
    const line = el("div", "line");
    line.append(el("b", "", MOCK.you.team), document.createTextNode(" vs " + mt.opponent));
    box.append(line);
    // 系列赛比分（我方在前）
    const foot = el("div", "foot");
    const won = mt.won ? "win" : "lose";
    foot.append(el("b", "mscore " + won, `${mt.score[0]} - ${mt.score[1]}`));
    foot.append(el("span", "res " + won, mt.won ? "胜" : "负"));
    // 本场积分变化：贴右显示，与「本站积分」的求和一致。
    const elo = el("span", "elo " + eloCls(mt.elo));
    elo.append(document.createTextNode("积分"), el("b", "", fmtElo(mt.elo)));
    foot.append(elo);
    box.append(foot);
    box.addEventListener("click", () => { matchIdx = i; mapIdx = "all"; renderDetail(); });
    list.append(box);
  });
  left.append(list);
  grid.append(left);

  // 右：图 tab + 表格
  const main = el("div", "detail-main");
  const mt = d[matchIdx];
  const tabs = el("div", "map-tabs");
  mt.maps.forEach((_, i) => tabs.append(mapTab(`图${"一二三四五"[i]}`, i)));
  tabs.append(mapTab("全场表现", "all", true));
  main.append(tabs);

  // 切到某一图时，比分板顶在表格上方；表格 caption 省掉，避免重复报一遍图号与胜负。
  if (mapIdx !== "all") main.append(mapScore(mt, mt.maps[mapIdx], mapIdx));

  const wrap = el("div", "stat-wrap");
  if (mapIdx === "all") {
    wrap.append(statTable(mt.maps, "全场表现", `BO${mt.maps.length >= 3 ? 3 : mt.maps.length} · ${mt.maps.length} 图`));
  } else {
    wrap.append(statTable([mt.maps[mapIdx]], null, null));
  }
  main.append(wrap);
  grid.append(main);
  body.replaceChildren(grid);
}

// 单图比分板：我方在左、对手在右，中间是大号比分（常规时间 13-x，12-12 后是加时终分）。
function mapScore(mt, mp, idx) {
  const box = el("div", "map-score");
  const head = el("div", "ms-head");
  head.append(el("span", "ms-map", `图${"一二三四五"[idx]}`));
  head.append(el("span", "tag " + (mp.won ? "green" : "red"), mp.won ? "本图获胜" : "本图失利"));
  box.append(head);

  const line = el("div", "ms-line");
  line.append(el("div", "ms-side", MOCK.you.team));
  const nums = el("div", "ms-nums");
  nums.append(el("b", mp.score[0] > mp.score[1] ? "hi" : "", String(mp.score[0])));
  nums.append(el("span", "colon", ":"));
  nums.append(el("b", mp.score[1] > mp.score[0] ? "hi" : "", String(mp.score[1])));
  line.append(nums);
  line.append(el("div", "ms-side right", mt.opponent));
  box.append(line);
  if (mp.overtimes) box.append(el("div", "ms-ot", mp.overtimes > 1 ? `加时 ×${mp.overtimes}（MR3）` : "加时（MR3）"));
  return box;
}

function mapTab(label, idx, all) {
  const b = el("button", "map-tab" + (mapIdx === idx ? " on" : "") + (all ? " all" : ""), label);
  b.type = "button";
  b.addEventListener("click", () => { mapIdx = idx; renderDetail(); });
  return b;
}

// 把若干张图的记录按选手聚合：K/D/A 取各图总和，Swing/ADR/KAST/Rating 取全局场均。
function statTable(maps, caption, tag) {
  const t = el("table", "stat-table");
  if (caption) {
    const cap = el("caption");
    cap.append(document.createTextNode(caption), el("span", "tag", tag));
    t.append(cap);
  }

  const thead = el("thead");
  const tr = el("tr");
  for (const h of ["选手", "K/D/A", "Swing", "ADR", "KAST", "Rating"]) tr.append(el("th", "", h));
  thead.append(tr);
  t.append(thead);

  t.append(buildSide(MOCK.you.team, maps, "mine"));
  t.append(buildSide(MOCK.detail[matchIdx].opponent, maps, "theirs"));
  return t;
}

function buildSide(teamName, maps, key) {
  const tb = el("tbody");

  // 队名分隔行
  const head = el("tr", "team-row");
  const headCell = el("td", "", teamName);
  headCell.colSpan = 6;
  head.append(headCell);
  tb.append(head);

  const sumOf = (pi, f) => maps.reduce((s, mp) => s + mp[key][pi][f], 0);
  const avgOf = (pi, f) => sumOf(pi, f) / maps.length;

  // 段内按 Rating 从高到低排列
  const order = maps[0][key].map((_, i) => i).sort((x, y) => avgOf(y, "rating") - avgOf(x, "rating"));

  for (const pi of order) {
    const p = maps[0][key][pi];
    const rating = avgOf(pi, "rating");
    const row = el("tr", p.me ? "me" : "");
    const nameCell = el("td");
    nameCell.append(document.createTextNode(p.id));
    if (p.role) nameCell.append(el("span", "role", p.role));
    row.append(nameCell);
    row.append(el("td", "", `${Math.round(sumOf(pi, "k"))}-${Math.round(sumOf(pi, "d"))}-${Math.round(sumOf(pi, "a"))}`));
    const sw = swing(rating);
    row.append(el("td", sw >= 0 ? "sw-up" : "sw-dn", fmtSwing(sw)));
    row.append(el("td", "", avgOf(pi, "adr").toFixed(0)));
    row.append(el("td", "", avgOf(pi, "kast").toFixed(0) + "%"));
    row.append(el("td", ratingCls(rating), rating.toFixed(2)));
    tb.append(row);
  }
  return tb;
}

/* ---------- 交互 ---------- */
document.querySelectorAll(".ev-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = btn.dataset.view;
    if (target === "close") {
      document.querySelector(".modal-panel").style.opacity = ".35";
      setTimeout(() => { document.querySelector(".modal-panel").style.opacity = "1"; }, 260);
      return;
    }
    view = target;
    document.querySelectorAll(".ev-btn").forEach(b => b.classList.toggle("on", b === btn));
    if (view === "overview") renderOverview();
    else renderDetail();
  });
});

renderOverview();
</script>
